name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor pyproject declares, and every version since. A
        # library is used on whatever its consumers run.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly: setup-uv stopped publishing moving major
      # tags at v8, so a bare @v10 does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Test
        run: uv run pytest

  # The vendored definition is what this library is held to. spec check
  # fails for a copy that differs from its manifest, and for a copy whose
  # commit is not on the branch main of assert-spec.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: stealth-scale/spec/.github/actions/setup-spec@78d70fd5be63102e43f8dd9628d4594914bb390e # v0.2.0
        with:
          version: v0.2.0

      - name: Check the vendored definition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: spec check --remote
